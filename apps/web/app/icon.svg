<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Civique">
  <title>Civique</title>
  <!-- Rounded square in deep aubergine — Civique brand background -->
  <rect width="64" height="64" rx="14" fill="#2D1B2E"/>

  <!-- Tricolor accent strip on the left edge: French flag bleu/blanc/rouge.
       Kept subtle (4px wide) so the C remains the dominant element. -->
  <rect x="0" y="14"  width="4" height="12" fill="#002395"/>
  <rect x="0" y="26"  width="4" height="12" fill="#F4ECDD"/>
  <rect x="0" y="38"  width="4" height="12" fill="#ED2939"/>

  <!-- Big serif "C" in bone, centered. Drawn as a path so it stays sharp
       at every size and doesn't depend on system fonts. -->
  <path
    d="
      M 50 21
      C 47 17, 41 14, 34 14
      C 22 14, 14 22, 14 32
      C 14 42, 22 50, 34 50
      C 41 50, 47 47, 50 43
      L 44 38
      C 42 41, 38 43, 34 43
      C 27 43, 22 38, 22 32
      C 22 26, 27 21, 34 21
      C 38 21, 42 23, 44 26
      Z
    "
    fill="#F4ECDD"
  />

  <!-- Tiny terracotta accent dot inside the C's opening — a quiet nod to
       the saffron/terracotta accents used throughout the Tisserand UI. -->
  <circle cx="52" cy="32" r="2.5" fill="#C7522A"/>
</svg>
