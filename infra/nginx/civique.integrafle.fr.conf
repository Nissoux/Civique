# Civique web — Nginx vhost for civique.integrafle.fr (+ www).
#
# Install on the VPS:
#   sudo cp /root/Civique/infra/nginx/civique.integrafle.fr.conf /etc/nginx/sites-available/civique.integrafle.fr
#   sudo ln -s /etc/nginx/sites-available/civique.integrafle.fr /etc/nginx/sites-enabled/civique.integrafle.fr
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d civique.integrafle.fr -d www.civique.integrafle.fr   # adds SSL + HTTP→HTTPS redirect
#
# After certbot runs, this file will be auto-modified to include
# `listen 443 ssl;` and `return 301 https://...;` blocks. Don't edit
# those by hand — re-run certbot if you need to change them.

upstream civique_web {
    server 127.0.0.1:3005;
    keepalive 16;
}

# Redirect apex → www (or the inverse — choose one and stick to it).
# We keep both reachable and let Vercel's canonical metadata handle SEO.
# If you want a strict redirect to www: uncomment the block below.
#
# server {
#     listen 80;
#     server_name civique.integrafle.fr;
#     return 301 http://www.civique.integrafle.fr$request_uri;
# }

server {
    listen 80;
    server_name civique.integrafle.fr www.civique.integrafle.fr;

    # Larger body size for any future file uploads (e.g. avatars).
    client_max_body_size 4M;

    # Gzip compression for HTML / JSON / JS / CSS. Next.js' static
    # assets are already content-hashed so we can cache aggressively
    # below — gzip handles the live HTML responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/atom+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers — keep these even before HTTPS because certbot
    # will preserve them when it injects the SSL block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Long-cache for content-hashed Next.js assets.
    location /_next/static/ {
        proxy_pass http://civique_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Files in /_next/static/ are immutable (content-hashed).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Long-cache for the favicon, logo, opengraph image.
    location ~* ^/(favicon|icon|logo-c|logo)\.(png|svg|ico)$ {
        proxy_pass http://civique_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Everything else: pass through to Next.js (Server Components,
    # Server Actions, RSC streaming, static HTML, redirects, etc.).
    location / {
        proxy_pass http://civique_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-style upgrade headers (not used today, but Next.js
        # may stream RSC over HTTP/1.1 chunked — these don't hurt).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Don't buffer streamed RSC responses.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
